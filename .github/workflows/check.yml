name: Check new chapters

on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17 (off-peak)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json

concurrency:
  group: manhwa-check         # never run two checks at the same time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "chapter-bot"
          git config user.email "chapter-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json unchanged"
            exit 0
          fi
          git commit -m "update state"
          # If someone pushed meanwhile (e.g. you edited a file), merge and retry.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push; then
              exit 0
            fi
            echo "push failed, retrying ($i/3)..."
            sleep 5
          done
          exit 1

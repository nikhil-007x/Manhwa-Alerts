name: Check new chapters

on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17 (off-peak)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "chapter-bot"
          git config user.email "chapter-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
